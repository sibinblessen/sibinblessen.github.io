name: Build and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false --runInBand

      - name: Build site
        run: npm run build

      - name: Commit build to gh-pages
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/gh-pages
          git worktree add --detach /tmp/gh-pages origin/gh-pages
          rsync -a --delete --exclude=.git build/ /tmp/gh-pages/
          git -C /tmp/gh-pages config user.name "github-actions[bot]"
          git -C /tmp/gh-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/gh-pages add -A
          if git -C /tmp/gh-pages diff --cached --quiet; then
            echo "Build output is already up to date."
          else
            git -C /tmp/gh-pages commit -m "Deploy ${GITHUB_SHA}"
            git -C /tmp/gh-pages push origin HEAD:gh-pages
          fi

  smoke-test:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed pages and assets
        env:
          SITE_URL: https://sibinblessen.github.io
        run: |
          set -euo pipefail
          for path in / /docs/sibin_blessen_resume.pdf /manifest.json /favicon.svg /sitemap.xml; do
            curl --fail --silent --show-error --location --retry 10 --retry-all-errors --head "${SITE_URL}${path}"
          done
          social_image=$(curl --fail --silent --show-error --location "${SITE_URL}/" | sed -n 's/.*property="og:image" content="\([^"]*\)".*/\1/p' | head -n 1)
          test -n "${social_image}"
          curl --fail --silent --show-error --location --retry 10 --retry-all-errors --head "${social_image}"
