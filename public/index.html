    <script>
      (function () {
        var theme = 'dark';
        try {
          var storedTheme = window.localStorage.getItem('portfolio-theme');
          if (storedTheme === 'dark' || storedTheme === 'light') {
            theme = storedTheme;
          }
        } catch (error) {
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    
    <!-- Primary Meta Tags -->
    <title>Sibin Blessen | Senior Software Engineer &amp; Java Developer</title>
    <meta name="title" content="Sibin Blessen | Senior Software Engineer &amp; Java Developer" />
